name: VinylDigger
options:
  bundleIdPrefix: de.schakal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  VinylDiggerKit:
    path: VinylDiggerKit
targets:
  VinylDigger:
    type: application
    platform: macOS
    sources:
      # App/Resources rides along here; the JSON dumps land flat in
      # Contents/Resources, which is where Bundle.main.url(forResource:) looks.
      - App
    dependencies:
      - package: VinylDiggerKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VinylDigger
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
